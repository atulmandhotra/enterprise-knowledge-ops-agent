name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: enterpriseknowledgeopsacr.azurecr.io
  IMAGE_NAME: enterprise-knowledge-ops-agent
  NAMESPACE: enterprise-knowledge-ops
  DEPLOYMENT: enterprise-knowledge-ops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Login to Azure Container Registry
      # ---------------------------------------------------------

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      # ---------------------------------------------------------
      # Build and push Docker image
      # ---------------------------------------------------------

      - name: Build and push Docker image
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"


      # ---------------------------------------------------------
      # Configure kubectl
      # ---------------------------------------------------------

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4


      # ---------------------------------------------------------
      # Configure Kubernetes credentials
      # ---------------------------------------------------------

      - name: Configure Kubernetes credentials
        run: |
          mkdir -p ~/.kube

          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config

          clusters:
          - name: aks
            cluster:
              server: ${{ secrets.KUBE_SERVER }}
              certificate-authority-data: ${{ secrets.KUBE_CA }}

          contexts:
          - name: aks
            context:
              cluster: aks
              namespace: ${{ env.NAMESPACE }}
              user: github-actions

          current-context: aks

          users:
          - name: github-actions
            user:
              token: ${{ secrets.KUBE_TOKEN }}
          EOF


      # ---------------------------------------------------------
      # Create/update application secrets
      # ---------------------------------------------------------

      - name: Create or update application secrets
        run: |
          kubectl create secret generic app-secrets \
            --namespace ${NAMESPACE} \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}" \
            --from-literal=LANGSMITH_ENDPOINT="${{ secrets.LANGSMITH_ENDPOINT }}" \
            --from-literal=LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
            --from-literal=LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ---------------------------------------------------------
      # Configure Kubernetes health probes
      # ---------------------------------------------------------

      - name: Configure health probes
        run: |
          kubectl patch deployment ${DEPLOYMENT} \
            --namespace ${NAMESPACE} \
            --type=strategic \
            -p '{
              "spec": {
                "template": {
                  "spec": {
                    "containers": [
                      {
                        "name": "enterprise-knowledge-ops-agent",
                        "ports": [
                          {
                            "containerPort": 8501
                          },
                          {
                            "containerPort": 8080
                          }
                        ],
                        "livenessProbe": {
                          "httpGet": {
                            "path": "/health/live",
                            "port": 8080
                          },
                          "initialDelaySeconds": 20,
                          "periodSeconds": 10,
                          "timeoutSeconds": 3,
                          "failureThreshold": 3
                        },
                        "readinessProbe": {
                          "httpGet": {
                            "path": "/health/ready",
                            "port": 8080
                          },
                          "initialDelaySeconds": 10,
                          "periodSeconds": 5,
                          "timeoutSeconds": 3,
                          "failureThreshold": 6
                        }
                      }
                    ]
                  }
                }
              }
            '


      # ---------------------------------------------------------
      # Update deployment image
      # ---------------------------------------------------------

      - name: Update deployment image
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          kubectl set image deployment/${DEPLOYMENT} \
            enterprise-knowledge-ops-agent="$IMAGE" \
            --namespace ${NAMESPACE}


      # ---------------------------------------------------------
      # Wait for rollout
      # ---------------------------------------------------------

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/${DEPLOYMENT} \
            --namespace ${NAMESPACE} \
            --timeout=5m


      # ---------------------------------------------------------
      # Verify deployment
      # ---------------------------------------------------------

      - name: Verify deployment
        run: |
          echo "Pods:"
          kubectl get pods \
            --namespace ${NAMESPACE} \
            -o wide

          echo ""
          echo "Deployment:"
          kubectl get deployment ${DEPLOYMENT} \
            --namespace ${NAMESPACE}

          echo ""
          echo "Pod readiness:"
          kubectl get pods \
            --namespace ${NAMESPACE} \
            -o jsonpath="{range .items[*]}{.metadata.name}{' -> '}{.status.containerStatuses[0].ready}{'\n'}{end}"