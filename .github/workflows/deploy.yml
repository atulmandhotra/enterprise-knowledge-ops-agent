name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: enterpriseknowledgeopsacr.azurecr.io
  IMAGE_NAME: enterprise-knowledge-ops-agent
  NAMESPACE: enterprise-knowledge-ops
  DEPLOYMENT: enterprise-knowledge-ops

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # Login to ACR
      # ========================================

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3

        with:

          registry: ${{ env.ACR_LOGIN_SERVER }}

          username: ${{ secrets.ACR_USERNAME }}

          password: ${{ secrets.ACR_PASSWORD }}


      # ========================================
      # Build and push Docker image
      # ========================================

      - name: Build and push Docker image
        run: |

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            .

          echo "Pushing image..."

          docker push "$IMAGE"


      # ========================================
      # Install kubectl
      # ========================================

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4


      # ========================================
      # Configure Kubernetes
      # ========================================

      - name: Configure Kubernetes credentials
        run: |

          mkdir -p ~/.kube

          cat > ~/.kube/config <<EOF

          apiVersion: v1

          kind: Config

          clusters:

          - name: aks

            cluster:

              server: ${{ secrets.KUBE_SERVER }}

              certificate-authority-data: ${{ secrets.KUBE_CA }}


          contexts:

          - name: aks

            context:

              cluster: aks

              namespace: ${{ env.NAMESPACE }}

              user: github-actions


          current-context: aks


          users:

          - name: github-actions

            user:

              token: ${{ secrets.KUBE_TOKEN }}

          EOF


      # ========================================
      # Generate Kubernetes Secret
      # ========================================

      - name: Generate application secret
        run: |

          sed \
            -e "s|OPENAI_API_KEY_PLACEHOLDER|${{ secrets.OPENAI_API_KEY }}|g" \
            -e "s|LANGSMITH_TRACING_PLACEHOLDER|${{ secrets.LANGSMITH_TRACING }}|g" \
            -e "s|LANGSMITH_ENDPOINT_PLACEHOLDER|${{ secrets.LANGSMITH_ENDPOINT }}|g" \
            -e "s|LANGSMITH_API_KEY_PLACEHOLDER|${{ secrets.LANGSMITH_API_KEY }}|g" \
            -e "s|LANGSMITH_PROJECT_PLACEHOLDER|${{ secrets.LANGSMITH_PROJECT }}|g" \
            k8s/secret.yaml \
            | kubectl apply -f -


      # ========================================
      # Deploy Deployment manifest
      # ========================================

      - name: Deploy application
        run: |

          echo "Deploying image:"

          echo "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"


          sed \
            "s|IMAGE_TAG_PLACEHOLDER|${GITHUB_SHA}|g" \
            k8s/deployment.yaml \
            | kubectl apply -f -


      # ========================================
      # Deploy Service manifest
      # ========================================

      - name: Deploy service
        run: |

          kubectl apply \
            -f k8s/service.yaml


      # ========================================
      # Wait for rollout
      # ========================================

      - name: Wait for rollout
        run: |

          kubectl rollout status \
            deployment/${DEPLOYMENT} \
            --namespace ${NAMESPACE} \
            --timeout=5m


      # ========================================
      # Verify deployment
      # ========================================

      - name: Verify deployment
        run: |

          echo "========================================"

          echo "PODS"

          echo "========================================"

          kubectl get pods \
            --namespace ${NAMESPACE} \
            -o wide


          echo "========================================"

          echo "DEPLOYMENT"

          echo "========================================"

          kubectl get deployment \
            ${DEPLOYMENT} \
            --namespace ${NAMESPACE}


          echo "========================================"

          echo "SERVICE"

          echo "========================================"

          kubectl get service \
            enterprise-knowledge-ops \
            --namespace ${NAMESPACE}